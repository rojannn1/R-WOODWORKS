<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log Custom Order - R. Woodworks</title>
<link rel="stylesheet" href="css/bootstrap.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone">
<div class="statusbar">9:41</div>

<a href="orders.html" class="back">&larr; Back</a>
<h2 class="page-title" style="margin-top:16px;">Log Custom Order</h2>
<p class="page-sub">Set up the specifications and details of the order.</p>
<form action="confirmation.html">
<div class="form-section">Customer</div>
<label class="form-label">Customer Name</label>
<input type="text" class="form-control mb-3" placeholder="e.g. Arthur Pendleton">
<label class="form-label">Contact Phone / Email</label>
<input type="text" class="form-control mb-3" placeholder="e.g. arthur@domain.com">
<div class="form-section">Project</div>
<label class="form-label">Woodworking Piece</label>
<input type="text" class="form-control mb-3" placeholder="e.g. Cedar Pergola">
<label class="form-label">Spec Details (Wood, Dimensions)</label>
<textarea class="form-control mb-3" rows="3" placeholder="e.g. Walnut, 6ft length, weather-proof sealer"></textarea>
<div class="form-section">Dates and Payment</div>
<label class="form-label">Target Delivery Date</label>
<input type="text" class="form-control mb-3" placeholder="YYYY-MM-DD">
<div class="row">
<div class="col-6"><label class="form-label">Price Quote ($)</label><input type="text" class="form-control mb-3" placeholder="e.g. 1200"></div>
<div class="col-6"><label class="form-label">Deposit Paid ($)</label><input type="text" class="form-control mb-3" placeholder="e.g. 400"></div>
</div>
<button type="submit" class="btn btn-dark w-100 mb-2">Save Order to Queue</button>
<a href="orders.html" class="btn btn-outline-dark w-100">Cancel</a>
</form>

</div>
</body>
</html>
